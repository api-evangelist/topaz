name: Topaz
kind: organization
description: Topaz is an open-source (Apache-2.0) authorizer for fine-grained,
  policy-based, real-time access control for applications and APIs, maintained by
  Aserto (github.com/aserto-dev/topaz). It combines the Open Policy Agent (OPA)
  decision engine with a built-in Zanzibar-style relationship directory, so you can
  express authorization as policy-as-code and model RBAC, ReBAC, and ABAC over an
  object graph of users, groups, resources, and relations. Topaz is self-hosted -
  you run the authorizer yourself (Docker or binary) and it exposes gRPC plus REST
  (gRPC-gateway) APIs from your own instance. The Authorizer API answers decisions
  (is, decisiontree, query); the Directory API reads and writes objects, relations,
  and permission checks; and a local web Console ships alongside. Aserto is the
  commercial hosted control plane built on Topaz for centrally managing policies,
  data, and decision logs across many deployed authorizers.
