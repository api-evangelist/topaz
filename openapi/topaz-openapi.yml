openapi: 3.0.3
info:
  title: Topaz Authorizer and Directory API
  description: >-
    Topaz is an open-source (Apache-2.0) authorizer for fine-grained,
    policy-based, real-time access control, maintained by Aserto
    (github.com/aserto-dev/topaz). It combines the Open Policy Agent (OPA)
    decision engine with a built-in Zanzibar-style relationship directory.
    Topaz is SELF-HOSTED: you run the authorizer yourself (Docker image
    ghcr.io/aserto-dev/topaz or a binary), and it exposes gRPC plus REST
    (gRPC-gateway) APIs from your own instance. The base URL is therefore your
    own deployment - by default the REST gateway listens on
    https://localhost:8383 (authorizer gRPC on :8282, directory gRPC on :9292,
    local web Console on :8080). In split deployments the directory REST
    endpoints may be exposed on :9393. This document models the REST surface:
    the Authorizer API (is / decisiontree / query and policy listing) under
    /api/v2, and the Directory v3 API (objects, relations, and checks) under
    /api/v3/directory. Aserto is the commercial hosted control plane built on
    Topaz; on Aserto the same contracts are served from tenant-scoped hosts
    such as https://authorizer.prod.aserto.com and
    https://directory.prod.aserto.com.
  version: '1.0'
  contact:
    name: Topaz
    url: https://www.topaz.sh
  license:
    name: Apache-2.0
    url: https://github.com/aserto-dev/topaz/blob/main/LICENSE
servers:
  - url: https://localhost:8383
    description: Self-hosted Topaz REST gateway (default). Replace with your own instance host.
  - url: https://authorizer.prod.aserto.com
    description: Aserto hosted control plane (Authorizer API), tenant-scoped.
  - url: https://directory.prod.aserto.com
    description: Aserto hosted control plane (Directory API), tenant-scoped.
security:
  - apiKey: []
tags:
  - name: Authorizer
    description: Policy-driven decisions - is, decisiontree, and query - evaluated by the OPA engine.
  - name: Policies
    description: OPA policy modules loaded into the authorizer.
  - name: Directory Objects
    description: Objects in the Zanzibar-style directory - users, groups, resources, and other entities.
  - name: Directory Relations
    description: Relations (tuples) connecting subjects to objects in the directory graph.
  - name: Directory Checks
    description: Graph-based check and graph-expansion queries over the directory.
paths:
  /api/v2/authz/is:
    post:
      operationId: is
      tags:
        - Authorizer
      summary: Is (authorization decision)
      description: >-
        Returns whether the identity in identityContext is allowed the
        decision(s) named in policyContext for the resource in resourceContext.
        The primary allowed/denied API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsRequest'
      responses:
        '200':
          description: The evaluated decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/authz/decisiontree:
    post:
      operationId: decisionTree
      tags:
        - Authorizer
      summary: Decision tree
      description: >-
        Evaluates every decision at (or below) a policy path in a single call
        and returns the tree of results, so a client can render, for example, a
        UI's enabled/disabled state in one round trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionTreeRequest'
      responses:
        '200':
          description: The decision tree of results.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/authz/query:
    post:
      operationId: query
      tags:
        - Authorizer
      summary: Query (arbitrary OPA/Rego query)
      description: >-
        Runs an arbitrary Rego query against the loaded policy and directory
        data, with optional identity, policy, and resource context. The most
        flexible, lowest-level decision call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: The query result set.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/policies:
    get:
      operationId: listPolicies
      tags:
        - Policies
      summary: List loaded policy modules
      description: Lists the OPA policy modules currently loaded into the authorizer.
      responses:
        '200':
          description: The loaded policy modules.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/policies/{id}:
    get:
      operationId: getPolicy
      tags:
        - Policies
      summary: Get a policy module
      description: Retrieves a single loaded OPA policy module by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested policy module.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v3/directory/object/{object_type}/{object_id}:
    parameters:
      - $ref: '#/components/parameters/ObjectType'
      - $ref: '#/components/parameters/ObjectId'
    get:
      operationId: getObject
      tags:
        - Directory Objects
      summary: Get object
      description: Retrieves a single directory object by its type and id.
      responses:
        '200':
          description: The requested object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteObject
      tags:
        - Directory Objects
      summary: Delete object
      description: Deletes a directory object by its type and id.
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v3/directory/objects/{object_type}:
    get:
      operationId: getObjects
      tags:
        - Directory Objects
      summary: List objects of a type
      description: Lists directory objects of a given type, with pagination.
      parameters:
        - $ref: '#/components/parameters/ObjectType'
        - name: page.size
          in: query
          required: false
          schema:
            type: integer
        - name: page.token
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Object'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v3/directory/object:
    post:
      operationId: setObject
      tags:
        - Directory Objects
      summary: Set object
      description: Creates or updates a directory object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object:
                  $ref: '#/components/schemas/Object'
      responses:
        '200':
          description: The created or updated object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v3/directory/relation:
    get:
      operationId: getRelation
      tags:
        - Directory Relations
      summary: Get relation
      description: >-
        Retrieves a single relation (tuple) identified by its object,
        relation name, and subject.
      parameters:
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: relation
          in: query
          schema:
            type: string
        - name: subject_type
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The requested relation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: setRelation
      tags:
        - Directory Relations
      summary: Set relation
      description: Creates or updates a relation between a subject and an object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relation:
                  $ref: '#/components/schemas/Relation'
      responses:
        '200':
          description: The created or updated relation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteRelation
      tags:
        - Directory Relations
      summary: Delete relation
      description: Deletes a relation identified by its object, relation name, and subject.
      parameters:
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: relation
          in: query
          schema:
            type: string
        - name: subject_type
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v3/directory/relations:
    get:
      operationId: getRelations
      tags:
        - Directory Relations
      summary: List relations
      description: >-
        Lists relations matching an optional object and/or subject filter,
        with pagination.
      parameters:
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: relation
          in: query
          schema:
            type: string
        - name: subject_type
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
        - name: page.size
          in: query
          schema:
            type: integer
        - name: page.token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of relations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Relation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v3/directory/check:
    post:
      operationId: check
      tags:
        - Directory Checks
      summary: Check
      description: >-
        Returns whether a subject has a given relation or permission on an
        object by traversing the directory relationship graph. The data-driven,
        Zanzibar-style access check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: The check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v3/directory/graph:
    get:
      operationId: getGraph
      tags:
        - Directory Checks
      summary: Get graph
      description: >-
        Expands the object graph from an anchor to return the set of subjects or
        objects reachable through a relation (for example, all users who are
        members of a group, directly or transitively).
      parameters:
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: relation
          in: query
          schema:
            type: string
        - name: subject_type
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The expanded graph result.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Self-hosted Topaz may run with no authentication (default), with a
        static API key, or behind mTLS. When keys are configured (and on the
        Aserto hosted service) pass the key in the Authorization header, along
        with the Aserto-Tenant-Id header on Aserto.
  parameters:
    ObjectType:
      name: object_type
      in: path
      required: true
      description: The object type, for example user, group, or resource.
      schema:
        type: string
    ObjectId:
      name: object_id
      in: path
      required: true
      description: The object identifier.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication failed or the API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    IdentityContext:
      type: object
      description: Who is making the request.
      properties:
        identity:
          type: string
        type:
          type: string
          description: One of IDENTITY_TYPE_NONE, IDENTITY_TYPE_SUB, IDENTITY_TYPE_JWT, IDENTITY_TYPE_MANUAL.
          example: IDENTITY_TYPE_SUB
    PolicyContext:
      type: object
      description: Which policy and decisions to evaluate.
      properties:
        path:
          type: string
          example: rebac.check
        decisions:
          type: array
          items:
            type: string
          example:
            - allowed
    IsRequest:
      type: object
      properties:
        identity_context:
          $ref: '#/components/schemas/IdentityContext'
        policy_context:
          $ref: '#/components/schemas/PolicyContext'
        resource_context:
          type: object
          additionalProperties: true
    IsResponse:
      type: object
      properties:
        decisions:
          type: array
          items:
            type: object
            properties:
              decision:
                type: string
              is:
                type: boolean
    DecisionTreeRequest:
      type: object
      properties:
        identity_context:
          $ref: '#/components/schemas/IdentityContext'
        policy_context:
          $ref: '#/components/schemas/PolicyContext'
        resource_context:
          type: object
          additionalProperties: true
    QueryRequest:
      type: object
      properties:
        query:
          type: string
          example: 'x = data'
        identity_context:
          $ref: '#/components/schemas/IdentityContext'
        policy_context:
          $ref: '#/components/schemas/PolicyContext'
        resource_context:
          type: object
          additionalProperties: true
    Object:
      type: object
      properties:
        type:
          type: string
          example: user
        id:
          type: string
          example: euang@acmecorp.com
        display_name:
          type: string
        properties:
          type: object
          additionalProperties: true
    Relation:
      type: object
      properties:
        object_type:
          type: string
          example: group
        object_id:
          type: string
          example: admin
        relation:
          type: string
          example: member
        subject_type:
          type: string
          example: user
        subject_id:
          type: string
          example: euang@acmecorp.com
    CheckRequest:
      type: object
      properties:
        object_type:
          type: string
        object_id:
          type: string
        relation:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
    CheckResponse:
      type: object
      properties:
        check:
          type: boolean
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
