meters:
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted Topaz authorizer (no vendor invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
  - replica
- name: directory_storage
  description: Storage backing the embedded Zanzibar-style directory (objects and relations).
  unit: bytes
  aggregation: max
  dimensions:
  - deployment
- name: aserto_subscription
  description: Optional Aserto hosted control-plane subscription (separate commercial product).
  unit: months
  aggregation: sum
  dimensions:
  - tenant
principles:
- name: Visibility
  description: Track the compute and storage of your Topaz authorizer replicas and directory; on Aserto, track the control-plane subscription separately.
- name: Allocation
  description: Tag Topaz deployments per application/team so authorization infrastructure maps to internal cost centers.
- name: Optimization
  description: Right-size replicas for decision volume, keep the directory scoped to needed objects/relations, and self-host to avoid vendor per-decision fees when volume is high.
- name: Accountability
  description: Assign owners per authorizer deployment; review monthly infrastructure cost against decision volume, and any Aserto subscription against its usage.
