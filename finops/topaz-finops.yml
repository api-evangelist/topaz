description: >-
  FinOps view of Topaz spend. Topaz is open source (Apache-2.0) and free to
  self-host - in that model there is no vendor invoice, and cost is the compute,
  memory, and storage for running the authorizer (often as a sidecar) plus the
  embedded directory. Because the authorizer runs local to your applications,
  the dominant cost drivers are replica count and directory size rather than
  per-decision charges. The optional Aserto hosted control plane (a separate
  commercial product built on Topaz) is where any subscription/usage spend lives:
  central policy and directory management, decision logs, and real-time sync to
  deployed authorizers. Aserto per-unit rates are not reconciled here.
notes: >-
  For self-hosted Topaz, model cost as owned infrastructure (containers running
  ghcr.io/aserto-dev/topaz) with no license fee. If you adopt Aserto, treat its
  control-plane subscription as a separate vendor charge and verify rates on the
  Aserto pricing page.
